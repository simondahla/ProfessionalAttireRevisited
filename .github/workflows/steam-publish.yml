name: Steam Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and package
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-package
          path: |
            package/
            build.vdf
            CHANGELOG.md

  approve:
    needs: package
    runs-on: ubuntu-latest
    environment: steam-production
    steps:
      - run: echo "Approved for Steam publish"

  publish:
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workshop-package

      - name: Extract this version's changelog section
        run: |
          awk '/^## /{if (found) exit; found=1} found' CHANGELOG.md > /tmp/notes.md
          NOTES=$(sed 's/"/\\"/g' /tmp/notes.md | tr '\n' ' ')
          sed -i "s#\"changenote\".*#\"changenote\" \"$NOTES\"#" build.vdf

      - name: Install steamcmd
        run: |
          mkdir -p ~/steamcmd && cd ~/steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -

      - name: Restore steamcmd session
        run: |
          mkdir -p ~/Steam/config
          echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 -d > ~/Steam/config/config.vdf

      - name: Upload to Workshop
        run: ~/steamcmd/steamcmd.sh +login "${{ secrets.STEAM_USERNAME }}" +workshop_build_item build.vdf +quit
