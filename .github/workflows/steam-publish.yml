name: Steam Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and package
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-package
          path: |
            package/
            build.vdf
            CHANGELOG.md

  approve:
    needs: package
    runs-on: ubuntu-latest
    environment: steam-production
    steps:
      - run: echo "Approved for Steam publish"

  publish:
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workshop-package

      - name: Extract this version's changelog section
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk '/^## /{if (found) exit; found=1} found' CHANGELOG.md > /tmp/notes.md
          python3 - <<'PYEOF'
          import os
          import re

          with open("/tmp/notes.md") as f:
              lines = f.read().splitlines()

          sections = []
          group, items = None, []
          for line in lines:
              line = line.strip()
              if not line or line.startswith("## "):
                  continue
              if line.startswith("### "):
                  if group and items:
                      sections.append((group, items))
                  group, items = line[4:].strip(), []
              elif line.startswith("- "):
                  items.append(line[2:].strip())
          if group and items:
              sections.append((group, items))

          body = " ".join(f"{g}: {', '.join(i)}." for g, i in sections)
          if not body:
              body = "See CHANGELOG.md for details."
          version = os.environ["VERSION"]
          notes = f"{version}: {body}" if version else body
          notes = notes.replace("\\", "\\\\").replace('"', '\\"')

          with open("build.vdf") as f:
              content = f.read()
          content = re.sub(r'"changenote"\s*".*"', f'"changenote" "{notes}"', content)
          with open("build.vdf", "w") as f:
              f.write(content)
          PYEOF

      - name: Install steamcmd
        run: |
          mkdir -p ~/steamcmd && cd ~/steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -

      - name: Restore steamcmd session
        run: |
          mkdir -p ~/Steam/config
          echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 -d > ~/Steam/config/config.vdf

      - name: Upload to Workshop
        run: ~/steamcmd/steamcmd.sh +login "${{ secrets.STEAM_USERNAME }}" +workshop_build_item "$GITHUB_WORKSPACE/build.vdf" +quit
